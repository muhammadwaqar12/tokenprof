[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenprof"
version = "0.1.0"
description = "A profiler for the context window. See what is actually eating your tokens, per turn."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Muhammad Waqar" }]
keywords = ["llm", "agents", "context", "tokens", "profiler", "observability", "cost"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Debuggers",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
rich = ["rich>=13.0"]
all = ["tiktoken>=0.7", "rich>=13.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6"]

[project.scripts]
tokenprof = "tokenprof.cli:main"

[project.urls]
Homepage = "https://github.com/muhammadwaqar12/tokenprof"
Issues = "https://github.com/muhammadwaqar12/tokenprof/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenprof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
